# HU-01 — first launch shows the 18+ gate; declining keeps the user there; confirming opens Inicio
# and the gate is not shown again after a relaunch.
# app.json has no bundle identifier yet: run with `maestro test -e APP_ID=<bundle id> .maestro/age-gate.yaml`.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- assertVisible: '¿Ya es mayor de edad?'
- assertVisible: 'Se lo preguntamos una sola vez.'
- tapOn: 'Soy menor de edad'
- assertVisible: 'Prendidos es solo para mayores de edad.*'
- assertVisible: '¿Ya es mayor de edad?'
- tapOn: 'Soy mayor de 18 años'
- assertNotVisible: '¿Ya es mayor de edad?'
- stopApp
- launchApp
- assertNotVisible: '¿Ya es mayor de edad?'
